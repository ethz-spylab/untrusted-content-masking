services:
  # Agent container — Xvfb + x11vnc + Firefox ESR (see environments/agent/Dockerfile).
  # Used by the runners as the browser the agent drives via xdotool / playwright.
  agent:
    build:
      context: ./environments/agent
      dockerfile: Dockerfile
    container_name: cua-image
    ports:
      - "5901:5901"
    dns:
      - 1.1.1.3
    environment:
      - DISPLAY=:99
    tty: true
    stdin_open: true
    networks:
      app_network:
        ipv4_address: 172.20.0.2
        aliases:
          - codecraft.io

  calendar:
    build:
      context: ./environments/custom_websites
      dockerfile: calendar/web.Dockerfile
    ports:
      - "8092:80"
    volumes:
      - ./logs:/usr/share/nginx/html/logs:rw
    networks:
      app_network:
        ipv4_address: 172.20.0.23
        aliases:
          - calendar.com
          - www.calendar.com

  ecommerce-search:
    build:
      context: ./environments/custom_websites
      dockerfile: ecommerce-search/web.Dockerfile
    ports:
      - "8091:80"
    volumes:
      - ./logs:/usr/share/nginx/html/logs:rw
    networks:
      app_network:
        ipv4_address: 172.20.0.21
        aliases:
          - ecommerce-search.com
          # Webshop tasks use http://shop.com; map that hostname here so they hit this local site.
          - shop.com
          - www.shop.com

  banking:
    build:
      context: ./environments/custom_websites
      dockerfile: banking/web.Dockerfile
    ports:
      - "8093:80"
    volumes:
      - ./logs:/usr/share/nginx/html/logs:rw
    networks:
      app_network:
        ipv4_address: 172.20.0.22
        aliases:
          - banking.com
          - www.banking.com
          - securebank.com

  customer-support:
    build:
      context: ./environments/custom_websites
      dockerfile: customer-support/web.Dockerfile
    ports:
      - "8094:80"
    volumes:
      - ./logs:/usr/share/nginx/html/logs:rw
    networks:
      app_network:
        ipv4_address: 172.20.0.24
        aliases:
          - support.com
          - www.support.com
          - helpdesk.com

  email:
    build:
      context: ./environments/custom_websites
      dockerfile: email/web.Dockerfile
    ports:
      - "8095:80"
    volumes:
      - ./logs:/usr/share/nginx/html/logs:rw
    networks:
      app_network:
        ipv4_address: 172.20.0.25
        aliases:
          - webmail.com
          - www.webmail.com
          - mail.com

  job-board:
    build:
      context: ./environments/custom_websites
      dockerfile: job-board/web.Dockerfile
    ports:
      - "8096:80"
    volumes:
      - ./logs:/usr/share/nginx/html/logs:rw
    networks:
      app_network:
        ipv4_address: 172.20.0.26
        aliases:
          - jobs.com
          - www.jobs.com
          - careers.com

  restaurant:
    build:
      context: ./environments/custom_websites
      dockerfile: restaurant/web.Dockerfile
    ports:
      - "8097:80"
    volumes:
      - ./logs:/usr/share/nginx/html/logs:rw
    networks:
      app_network:
        ipv4_address: 172.20.0.27
        aliases:
          - restaurant.com
          - www.restaurant.com
          - bellavista.com

  travel-booking:
    build:
      context: ./environments/custom_websites
      dockerfile: travel-booking/web.Dockerfile
    ports:
      - "8098:80"
    volumes:
      - ./logs:/usr/share/nginx/html/logs:rw
    networks:
      app_network:
        ipv4_address: 172.20.0.28
        aliases:
          - travel.com
          - www.travel.com
          - travelportal.com

  wiki:
    build:
      context: ./environments/custom_websites
      dockerfile: wiki/web.Dockerfile
    ports:
      - "8099:80"
    volumes:
      - ./logs:/usr/share/nginx/html/logs:rw
    networks:
      app_network:
        ipv4_address: 172.20.0.29
        aliases:
          - wiki.com
          - www.wiki.com
          - knowledge.com

  forum:
    build:
      context: ./environments/custom_websites
      dockerfile: forum/web.Dockerfile
    ports:
      - "8100:80"
    volumes:
      - ./logs:/usr/share/nginx/html/logs:rw
    networks:
      app_network:
        ipv4_address: 172.20.0.30
        aliases:
          - forum.com
          - www.forum.com
          - devforum.com

  # ===========================================================================
  # VWA (Visual WebArena) GitLab — local Nginx proxy in front of AWS GitLab CE.
  # GitLab itself runs on AWS; this container injects reveal.js / gitlab-marker.js
  # into responses. Upstream is configured by GITLAB_BACKEND_HOST /
  # GITLAB_PUBLIC_HOST in .env (substituted into nginx.conf at container start).
  # ===========================================================================

  vwa_gitlab_nginx:
    build:
      context: ./environments/webarena/gitlab-setup
      dockerfile: Dockerfile.nginx
    container_name: hackathon-operator-vwa-gitlab-nginx
    ports:
      - "8103:80"
    environment:
      - GITLAB_BACKEND_HOST=${GITLAB_BACKEND_HOST}
      - GITLAB_PUBLIC_HOST=${GITLAB_PUBLIC_HOST}
    volumes:
      - ./logs:/usr/share/nginx/html/logs:rw
      - ./environments/webarena/gitlab-setup/nginx-files/reveal.js:/usr/share/nginx/html/reveal.js:ro
      - ./environments/webarena/gitlab-setup/nginx-files/gitlab-marker.js:/usr/share/nginx/html/gitlab-marker.js:ro
      - ./environments/webarena/gitlab-setup/nginx-files/security-tracker.js:/usr/share/nginx/html/security-tracker.js:ro
      - ./environments/webarena/gitlab-setup/nginx-files/html-cache.js:/usr/share/nginx/html/html-cache.js:ro
      - ./environments/webarena/gitlab-setup/nginx-files/reveal.css:/usr/share/nginx/html/reveal.css:ro
    networks:
      app_network:
        ipv4_address: 172.20.0.51
        aliases:
          - gitlab-vwa.com
          - www.gitlab-vwa.com
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  app_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.20.0.0/16
